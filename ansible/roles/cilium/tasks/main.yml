# Staged in the k3s auto-deploy dir. Safe before k3s starts: k3s applies these
# in name order and retries every 15s until each succeeds, so the pool and
# policy apply once Cilium has registered its CRDs.
- name: Ensure k3s manifests directory exists
  ansible.builtin.file:
    path: "{{ k3s_manifests_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Stage Cilium manifests
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ k3s_manifests_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: cilium-helmchart.yaml.j2, dest: cilium.yaml }
    - { src: cilium-lb.yaml.j2, dest: cilium-lb.yaml }
