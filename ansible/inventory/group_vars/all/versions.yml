# Every pinned version in one place.

# Fresh installs / new nodes only. Running nodes are upgraded by the SUC Plans
# in argo-apps/system-upgrade-controller; bump this in the same commit.
k3s_version: "v1.36.5+k3s1"

kube_vip_version: "v1.0.0"

# Cilium upgrades: one minor at a time, then re-stage with --tags cilium.
cilium_version: "1.20.4"

# Traefik and its Gateway API CRDs are bundled with k3s and follow k3s_version
# (v1.36.5+k3s1 ships Traefik 3.7.13, Gateway API v1.6.1).

argocd_chart_version: "10.11.6"
