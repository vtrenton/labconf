# The single entry point for exposed infra services, on 10.0.0.165 (the whole
# kube-vip-cloud-provider pool). Attach HTTPRoutes from any namespace with:
#   parentRefs: [{name: infra, namespace: gateway}]
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: infra
  namespace: gateway
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      kube-vip.io/loadbalancerIPs: 10.0.0.165
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # *.infra.lab.trentonvanderwert.com (labns -> .165), Let's Encrypt
    # wildcard from certificate.yaml. HTTP for these names redirects here
    # (http-redirect.yaml); attach their routes with sectionName: https.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.infra.lab.trentonvanderwert.com"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: infra-wildcard-tls
      allowedRoutes:
        namespaces:
          from: All
