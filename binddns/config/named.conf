options {
    directory "/var/cache/bind";

    // IPs BIND will listen on
    listen-on { any; };
    allow-query-cache {
        10.0.0.0/24;
        192.168.0.0/24;
    };

    // Allow recursive queries from your local network.
    // Replace 'localnets' with your specific network range if needed.
    allow-recursion { 10.0.0.0/24; 192.168.0.0/24; };

    // Hardening - Allow Queries from only trusted LANs
    allow-query { 10.0.0.0/24; 192.168.0.0/24; };

    // Upstream DNS servers for non-local queries
    forwarders {
        1.1.1.1;
        8.8.8.8;
    };

    // Enable the DNS server to act as a caching server
    forward only;

    dnssec-validation auto;

    auth-nxdomain no;    // Conform to RFC1035
};

zone "starfleet.lan" IN {
    type master;
    file "/etc/bind/zones/db.starfleet.lan"; // Path to the forward zone file
};

zone "0.0.10.in-addr.arpa" IN {
    type master;
    file "/etc/bind/zones/10.0.0.rev"; // Path to the reverse zone file
};

