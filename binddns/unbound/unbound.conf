# Unbound on dns1 (was labns): the resolver every network talks to.
#
#   clients :53 -> Unbound -> local zones: stub to BIND on 127.0.0.1:5300
#                          -> everything else: Quad9 over DNS-over-TLS (853)
#
# Networks and what they may ask are set below (access-control); the IoT
# network gets the allowlist-only view "iot". The UDM firewall lets every
# network reach this host on 53 only (udm-pro-config, lan_allow to_dns), and
# only this network may send DNS/DoT to the internet.

server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no                      # no IPv6 on the LANs (ipv6.interface_type = none)

    # No chroot: the container is the isolation, and the anchor and CA
    # bundle live outside /etc/unbound.
    chroot: ""

    # Who may query. Everything not listed is refused.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 192.168.0.0/24 allow      # home (wired)
    access-control: 192.168.1.0/24 allow      # wireless
    access-control: 192.168.2.0/24 allow      # guest
    access-control: 192.168.254.0/24 allow    # Default (management)
    access-control: 10.0.0.0/24 allow         # labnet
    access-control: 10.0.1.0/24 allow         # camera
    access-control: 10.0.53.0/24 allow        # dns
    access-control: 10.0.2.0/24 allow         # iot ...
    access-control-view: 10.0.2.0/24 iot      # ... but only through the allowlist view

    # Ad/tracker blocking (the rpz: sections below) for people's networks
    # only: home, wireless, guest. Not labnet, camera, dns or management.
    define-tag: "adblock"
    access-control-tag: 192.168.0.0/24 "adblock"
    access-control-tag: 192.168.1.0/24 "adblock"
    access-control-tag: 192.168.2.0/24 "adblock"

    # Privacy / hardening.
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    use-caps-for-id: no
    prefetch: yes

    # respip: needed for the rpz: (ad blocking) sections below.
    module-config: "respip validator iterator"

    # DNSSEC. The anchor file must be writable (RFC 5011 rollover); seed it
    # once with unbound-anchor (README).
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # DNS-over-TLS upstream needs the CA bundle.
    tls-cert-bundle: "/etc/ssl/certs/ca-certificates.crt"

    # Rebinding protection: public names may not answer with private
    # addresses, except the local zones, which do on purpose.
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-domain: "labnet.lan"
    private-domain: "wired.lan"
    private-domain: "lab.trentonvanderwert.com"

    # The local zones are unsigned: don't expect a DNSSEC chain for them.
    domain-insecure: "labnet.lan"
    domain-insecure: "wired.lan"
    domain-insecure: "lab.trentonvanderwert.com"
    domain-insecure: "0.0.10.in-addr.arpa"
    domain-insecure: "53.0.10.in-addr.arpa"

    # Unbound answers RFC 1918 reverse zones itself (NXDOMAIN) unless told
    # not to; lift that for 10/8 so the stubs below are used. Other private
    # reverse lookups keep the built-in NXDOMAIN.
    local-zone: "10.in-addr.arpa." nodefault

    # BIND is on localhost.
    do-not-query-localhost: no

    # Logging to stderr (podman logs unbound). log-local-actions records
    # every answer from a local-zone rule, i.e. each IoT refusal: client IP,
    # name, type, action (the IoT runbook reads these).
    use-syslog: no
    logfile: ""
    verbosity: 1
    log-local-actions: yes
    log-servfail: yes

# IoT (10.0.2.0/24): every name is REFUSED except the allowlist.
view:
    name: "iot"
    local-zone: "." refuse
    include: "/etc/unbound/iot-allowlist.conf"

# Ad blocking, for clients tagged "adblock" (home, wireless, guest). The
# first rpz zone that matches wins, so the exceptions come first.
rpz:
    name: "adblock-allow.rpz."
    zonefile: "/etc/unbound/adblock-allow.rpz"
    tags: "adblock"
    rpz-log: yes
    rpz-log-name: "adblock-allow"

# HaGeZi Multi NORMAL (ads, trackers, telemetry, phishing, malware; "mostly
# won't cause restrictions"). Downloaded by Unbound itself and refreshed per
# the list's SOA (8h); the last copy is kept in zonefile and used at start.
rpz:
    name: "adblock.rpz."
    url: "https://raw.githubusercontent.com/hagezi/dns-blocklists/main/rpz/multi.txt"
    zonefile: "/var/lib/unbound/adblock.rpz"
    tags: "adblock"
    rpz-log: yes
    rpz-log-name: "adblock"

# Local zones: authoritative on BIND.
stub-zone:
    name: "labnet.lan"
    stub-addr: 127.0.0.1@5300
stub-zone:
    name: "wired.lan"
    stub-addr: 127.0.0.1@5300
stub-zone:
    name: "lab.trentonvanderwert.com"
    stub-addr: 127.0.0.1@5300
stub-zone:
    name: "0.0.10.in-addr.arpa"
    stub-addr: 127.0.0.1@5300
stub-zone:
    name: "53.0.10.in-addr.arpa"
    stub-addr: 127.0.0.1@5300

# Everything else: Quad9 (malware-filtered, as before) over TLS.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
