// BIND on dns2: a secondary of every zone on dns1 (named.conf), for dns2's
// own Unbound. Copied to dns2 as /bind/config/named.conf.
//
// Zones are edited only on dns1. A serial bump there sends a NOTIFY here and
// this copy transfers the zone within seconds; it also checks dns1's SOA every
// Refresh (1h). If dns1 is down, this keeps answering from its last copy until
// Expire (7 days). The copies live in /var/cache/bind (/bind/cache).
//
// Same as dns1 otherwise: no recursion, Unbound reaches it on localhost.
// 10.0.53.12 is only for NOTIFYs from dns1.

options {
    directory "/var/cache/bind";

    listen-on port 5300 { 127.0.0.1; 10.0.53.12; };   // not 5353: that is mDNS (avahi)
    listen-on-v6 { none; };

    recursion no;
    allow-query { localhost; };
    allow-transfer { none; };
    notify no;

    dnssec-validation no;       // Unbound validates; BIND only serves
};

primaries dns1 { 10.0.53.11 port 5300; };

zone "labnet.lan" IN {
    type secondary;
    primaries { dns1; };
    file "db.labnet.lan";
};

zone "lab.trentonvanderwert.com" IN {
    type secondary;
    primaries { dns1; };
    file "db.lab.trentonvanderwert.com";
};

zone "wired.lan" IN {
    type secondary;
    primaries { dns1; };
    file "db.wired.lan";
};

zone "0.0.10.in-addr.arpa" IN {
    type secondary;
    primaries { dns1; };
    file "10.0.0.rev";
};

zone "53.0.10.in-addr.arpa" IN {
    type secondary;
    primaries { dns1; };
    file "10.0.53.rev";
};
