# dns1 and dns2 (labconf binddns/): reached directly over SSH from home, not
# through Teleport, so these playbooks never depend on the DNS they manage.
# Hosts and groups only; settings live in group_vars/ and host_vars/.
all:
  children:
    dns:
      hosts:
        dns1:
          ansible_host: 10.0.53.11
        dns2:
          ansible_host: 10.0.53.12
