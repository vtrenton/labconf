node_prep_firmware_dir: /boot/firmware
node_prep_cmdline_file: "{{ node_prep_firmware_dir }}/cmdline.txt"
node_prep_cmdline_params: cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1

# Debian generic arm64 kernel, booted from {{ node_prep_firmware_dir }}/<subdir>
node_prep_boot_subdir: debian
node_prep_boot_dtb: bcm2711-rpi-4-b.dtb
node_prep_initramfs_modules:
  - sdhci_iproc
  - mmc_block
# Device tree overlays for the upstream DT (files/<name>.dts, built on the
# node, applied by the firmware via config.txt)
node_prep_dt_overlays:
  - tpm-slb9670-upstream    # Infineon SLB9670 TPM on SPI0 CE1
  - disable-wifi-upstream   # Wi-Fi SDIO controller off
node_prep_blacklist_modules:
  - brcmfmac
  - brcmfmac_wcc

# crictl is not listed: k3s ships its own, matched to its version.
node_prep_packages:
  - vim
  - bind9-dnsutils   # provides dig; "dnsutils" is only a transitional name on trixie

node_prep_kernel_modules:
  - br_netfilter

node_prep_sysctl_file: /etc/sysctl.d/99-kubeconfig.conf
node_prep_sysctls:
  - net.ipv4.ip_forward
  - net.bridge.bridge-nf-call-iptables
  - net.bridge.bridge-nf-call-ip6tables

# SSD for k3s state (etcd, images), mounted at k3s_data_dir
node_prep_storage_device: /dev/sda
node_prep_storage_fstype: ext4

# Teleport SSH agent. Joins with the TPM (token pilab-nodes in
# infralab/argo-apps/teleport-resources allows each Pi's EK). The version
# below only bootstraps teleport-update; after that Managed Updates
# (group pilab) follow the cluster's autoupdate_version.
node_prep_teleport_proxy: teleport.aws.trentonvanderwert.com:443
node_prep_teleport_token: pilab-nodes
node_prep_teleport_update_group: pilab
node_prep_teleport_bootstrap_version: 18.11.3
node_prep_teleport_bootstrap_sha256: 4af2b4f563eccae32f7024f7a551e7e5a2d1362cb481af872bd284957bc8ea4f
