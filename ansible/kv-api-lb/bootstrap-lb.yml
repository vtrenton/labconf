# bootstrap-lb.yml
- name: Create k0s manifests dir and push files to masters
  hosts: masters
  become: true
  gather_facts: false

  vars:
    target_dir: /var/lib/k0s/manifests/kube-vip/
    files_to_copy:
      - kube-vip-ds.yaml
      - rbac.yaml

  tasks:
    - name: Ensure target directory exists
      ansible.builtin.file:
        path: "{{ target_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy required manifest files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ target_dir }}/{{ item | basename }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ files_to_copy }}"

