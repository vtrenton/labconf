# kube-prometheus-stack values for infralab. pilab runs the same chart in
# agent mode (pilab/argo-apps/monitoring-agent) and remote-writes here.

# k3s runs etcd, scheduler and controller-manager inside the k3s binary with
# no separately scrapeable endpoints, and there is no kube-proxy (Cilium).
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    alertmanager: false
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

# Cardinality (k3s): the kubelet's /metrics endpoint also exposes the embedded
# apiserver/etcd/scheduler metrics, so the kubelet and apiserver jobs scraped
# the same large histograms twice (~245k series per cluster, which filled the
# pilab agent's 512Mi in-memory WAL in ~4h). Drop what no bundled rule or
# dashboard uses. Overriding metricRelabelings replaces the chart defaults, so
# those are repeated first.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # chart default: thin out the duration histograms' buckets
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels: [__name__, le]
      # unused by rules/dashboards (the SLO rules use the _sli_ histogram)
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes)_bucket
kubelet:
  serviceMonitor:
    metricRelabelings:
      # chart default
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # k3s: control-plane metrics on the kubelet endpoint (the apiserver job
      # already has what the apiserver dashboards and rules use)
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd|scheduler|workqueue|aggregator|apiextensions|authentication|authorization|field_validation)_.+

# No receivers yet
alertmanager:
  enabled: false

prometheus-node-exporter:
  prometheus:
    monitor:
      # Node name on every node-exporter series (dashboards group by it)
      # action is spelled out (it's the API default) so Argo CD's diff
      # matches the live object
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node

prometheus:
  prometheusSpec:
    # Every scraped series gets cluster=infralab; pilab's arrive with
    # cluster=pilab. Dashboards use the label to tell them apart.
    scrapeClasses:
      - name: cluster-label
        default: true
        relabelings:
          - action: replace
            targetLabel: cluster
            replacement: infralab

    # pilab's agent pushes to /api/v1/write (exposed on the Gateway, see
    # manifests/httproutes.yaml). Unauthenticated: LAN only.
    enableRemoteWriteReceiver: true

    # Pick up ServiceMonitors/PodMonitors/rules from any app, not just this
    # release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    retention: 30d
    retentionSize: 40GB
    # local-path: on one node's NVMe; the pod is pinned to that node
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

grafana:
  # Stateless: dashboards come from ConfigMaps (sidecar), datasource from the
  # chart. Nothing is edited in the UI.
  persistence:
    enabled: false

  # No admin user at all, so no password to generate, store or drift on every
  # Argo CD render. Anonymous Viewer only.
  env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

  grafana.ini:
    server:
      root_url: https://grafana.infra.lab.trentonvanderwert.com/
    auth:
      disable_login_form: true
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    dashboards:
      # The TV: https://grafana.infra.lab.trentonvanderwert.com/?kiosk
      default_home_dashboard_path: /tmp/dashboards/lab-overview.json
    users:
      default_theme: dark
    analytics:
      reporting_enabled: false
      check_for_updates: false

  sidecar:
    dashboards:
      # Adds a cluster picker to the bundled dashboards
      multicluster:
        global:
          enabled: true
