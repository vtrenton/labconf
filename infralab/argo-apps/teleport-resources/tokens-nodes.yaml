# SSH node join tokens: TPM join, one allow rule per node's Endorsement Key
# (`teleport tpm identify`). EK hashes are hardware identities, not secrets:
# only the matching TPM can prove it holds the key. They survive OS
# reinstalls. New node = add its rule. Agents: /etc/teleport.yaml
# (infralab/autoinstall, pilab/ansible/roles/node_prep).
---
apiVersion: resources.teleport.dev/v2
kind: TeleportProvisionToken
metadata:
  name: infralab-nodes
spec:
  roles: [Node]
  join_method: tpm
  tpm:
    allow:
      - description: infra1
        ek_public_hash: "6eb1596128ebc13b10d8d8acb26887bc3bfa6c2120b0875e672d5972cf57977e"
        ek_certificate_serial: "59:d4:e9:a2:70:88:70:a0:80:f0:f6:2f:33:de:6c:d7"
      - description: infra2
        ek_public_hash: "cfbc95bf2c9d33f931015ba18b61c8e2da194ff72f14c0128acdf325c2b9cf9b"
        ek_certificate_serial: "50:dc:5d:e1:a6:dc:e4:3f:cb:23:fb:5c:cc:e0:00:1c"
      - description: infra3
        ek_public_hash: "0c5fbb2c28809f79155690ca73895a723926c8a84050688f3a3dc4e2f0a7ee0f"
        ek_certificate_serial: "54:7d:12:fa:2e:c3:79:8f:45:6a:7d:35:f2:d5:f7:d2"
