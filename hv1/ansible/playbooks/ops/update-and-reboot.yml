# update-and-reboot.yml - patch hv1 (apt full-upgrade) and reboot only when
# a newer kernel or a Secure Boot chain update is installed. This playbook is
# the only thing that upgrades packages: unattended upgrades are kept off
# (enforced below).
#
#   ansible-playbook playbooks/ops/update-and-reboot.yml           # patch
#   ansible-playbook playbooks/ops/update-and-reboot.yml --check   # report only
#
# Secure Boot chain updates (shim, GRUB, Proxmox's Secure Boot policies)
# change what the TPM measures (PCR 7), so the next boot may ask for the
# recovery passphrase at the console. The run stops before upgrading when one
# is pending; re-run with -e bootchain_ok=true when you're at the machine. It
# then reboots right away, so a refused TPM shows up now rather than after the
# next power cut, and checks that the TPM still unseals rpool's keys.
#
# Not here: the Teleport agent (Managed Updates, group hv1) and major Proxmox
# upgrades (follow Proxmox's upgrade guide and its pveXtoY checker).
- name: Update hv1 and reboot if required
  hosts: hv1
  gather_facts: false
  any_errors_fatal: true

  vars:
    bootchain_ok: false
    # Package names that can change PCR 7 (prefix match)
    bootchain_prefixes: [shim, grub, proxmox-grub, proxmox-secure-boot]

  tasks:
    - name: Keep this playbook the only thing that upgrades packages
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99-labconf-no-unattended-upgrades
        content: |
          // Managed by labconf. Package updates happen only through
          // hv1/ansible/playbooks/ops/update-and-reboot.yml.
          APT::Periodic::Unattended-Upgrade "0";
        owner: root
        group: root
        mode: '0644'

    - name: Refresh the package lists
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: List what a full-upgrade would install
      ansible.builtin.command: apt-get -s full-upgrade
      register: simulate
      changed_when: false
      check_mode: false

    - name: Collect pending packages
      ansible.builtin.set_fact:
        pending: "{{ simulate.stdout | regex_findall('(?m)^Inst (\\S+)') }}"
        pending_bootchain: >-
          {{ simulate.stdout | regex_findall('(?m)^Inst (\S+)')
             | select('match', '^(' ~ (bootchain_prefixes | join('|')) ~ ')') | list }}

    - name: Show pending packages
      ansible.builtin.debug:
        msg: "{{ (pending | length) }} to upgrade: {{ pending | join(' ') if pending else 'nothing' }}"

    - name: Stop before a Secure Boot chain update unless you're at the console
      ansible.builtin.fail:
        msg: >-
          Pending Secure Boot chain update: {{ pending_bootchain | join(' ') }}.
          The next boot may ask for the LUKS recovery passphrase at the console
          (PCR 7 changes). Re-run with -e bootchain_ok=true when you're at the
          machine; it reboots and then checks the TPM unlock.
      when: pending_bootchain | length > 0 and not (bootchain_ok | bool)

    - name: Full upgrade
      ansible.builtin.apt:
        upgrade: dist
      when: pending | length > 0

    - name: Compare the running kernel with the newest installed one
      ansible.builtin.shell: |
        set -eu
        running=$(uname -r)
        newest=$(ls -1 /lib/modules | sort -V | tail -n1)
        echo "$running $newest"
        if [ "$running" != "$newest" ] || [ -e /var/run/reboot-required ]; then echo reboot; fi
      register: kernel
      changed_when: false
      check_mode: false

    - name: Report the reboot decision
      ansible.builtin.debug:
        msg: >-
          {{ 'Reboot: newer kernel (running/newest: ' ~ kernel.stdout_lines[0] ~ ')' if 'reboot' in kernel.stdout_lines
             else 'Reboot: Secure Boot chain updated (tests the TPM unlock now)' if pending_bootchain
             else 'No reboot needed' }}

    # Proxmox shuts guests down cleanly (pve-guests) and starts those marked
    # "start at boot". rpool unlocks from the TPM; fast with its key file.
    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 900
        msg: "Rebooting after updates (labconf hv1 update-and-reboot.yml)"
      when: "'reboot' in kernel.stdout_lines or pending_bootchain | length > 0"

    - name: Both pools are ONLINE
      ansible.builtin.command: zpool list -H -o name,health rpool fast
      register: pools
      changed_when: false
      check_mode: false
      failed_when: >-
        pools.rc != 0 or
        (pools.stdout_lines | map('split') | selectattr(1, 'ne', 'ONLINE') | list | length) > 0

    - name: Disks unlocked and Teleport agent running
      ansible.builtin.command: >-
        systemctl is-active
        systemd-cryptsetup@luks\x2drpool0.service systemd-cryptsetup@luks\x2drpool1.service
        systemd-cryptsetup@luks\x2dfast0.service systemd-cryptsetup@luks\x2dfast1.service
        teleport
      changed_when: false
      check_mode: false

    # Every run, not only after a reboot: if the TPM refuses, the next boot
    # waits at the console for the recovery passphrase (a power cut leaves hv1
    # down). The key goes to /dev/null; only the result is printed.
    - name: TPM still unseals each rpool key
      ansible.builtin.shell: |
        set -u
        failed=0
        uuids=$(awk '$1 ~ /^luks-rpool/ { sub(/^UUID=/, "", $2); print $2 }' /etc/crypttab)
        [ -n "$uuids" ] || { echo "no luks-rpool entries in /etc/crypttab"; exit 1; }
        for uuid in $uuids; do
          d=/dev/disk/by-uuid/$uuid
          slot=$(clevis luks list -d "$d" | awk -F: '/ tpm2 / { print $1; exit }')
          if [ -z "$slot" ]; then
            echo "$d: no TPM binding"; failed=1
          elif clevis luks pass -d "$d" -s "$slot" >/dev/null 2>&1; then
            echo "$d: slot $slot unseals"
          else
            echo "$d: TPM refused slot $slot. On hv1: clevis luks regen -d $d -s $slot (asks for the recovery passphrase)"
            failed=1
          fi
        done
        exit $failed
      register: tpm
      changed_when: false
      check_mode: false

    - name: Guests that aren't running
      ansible.builtin.shell: >-
        pvesh get /cluster/resources --type vm --output-format json |
        python3 -c 'import json,sys; [print(g["id"], g.get("name",""), g["status"]) for g in json.load(sys.stdin) if g["status"] != "running"]'
      register: guests
      changed_when: false
      check_mode: false

    - name: Report stopped guests (check their "start at boot" setting)
      ansible.builtin.debug:
        msg: "{{ guests.stdout_lines if guests.stdout_lines else 'All guests running' }}"
