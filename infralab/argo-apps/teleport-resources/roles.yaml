# Access to both labs. Assigned to users outside git (users are not
# operator-managed; break-glass stays independent):
#   tctl users update trent --set-roles editor,access,lab-admin
apiVersion: resources.teleport.dev/v1
kind: TeleportRoleV8
metadata:
  name: lab-admin
spec:
  allow:
    # infralab nodes log in as sysadmin, the Pis as admin
    logins: [sysadmin, admin]
    node_labels:
      lab: [infralab, pilab]
    kubernetes_labels:
      lab: [infralab, pilab]
    kubernetes_groups: [system:masters]
    # Apps discovered by the lab kube agents (teleport.dev/app: "true")
    app_labels:
      teleport.dev/kubernetes-cluster: [infralab, pilab]
    kubernetes_resources:
      - kind: "*"
        api_group: "*"
        namespace: "*"
        name: "*"
        verbs: ["*"]
    rules:
      # Drive Managed Updates for the lab agents by hand, e.g. for a security
      # fix outside the regular window:
      #   tctl autoupdate agents start-update infralab
      #   tctl autoupdate agents status
      # The schedule and target version stay in autoupdate.yaml (GitOps).
      - resources: [autoupdate_agent_rollout]
        verbs: [read, update]
