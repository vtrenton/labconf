# IoT DNS allowlist (included in the "iot" view of unbound.conf).
#
# Everything not listed here is REFUSED for 10.0.2.0/24 and logged
# (log-local-actions). One line per name: `transparent` resolves it and every
# name below it normally. Use the narrowest name that works
# (iot.vendor.example, not vendor.example), and say who needs it and why:
#
#   # thermostat (10.0.2.23): app control, 2026-11
#   local-zone: "api.vendor.example." transparent
#
# CNAMEs: if an allowed name answers via a CNAME (e.g. to a CDN), the target
# is checked too and needs its own line. Workflow: udm-pro-config
# IMPLEMENTATION.md, "Runbook: an IoT device doesn't work".
#
# Apply after a change: copy to /bind/unbound/ on dns1, then
# `podman restart unbound` (remote-control is not enabled).
