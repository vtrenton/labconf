# prep-nodes.yml
- name: Prepare nodes and install cri-tools
  hosts: all
  become: true
  gather_facts: true

  vars:
    kubic_repo_url: "http://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/stable/Debian_Unstable/ /"
    kubic_key_url: "https://download.opensuse.org/repositories/devel:kubic:libcontainers:stable/Debian_Unstable/Release.key"
    kubic_repo_filename: "devel_kubic_libcontainers_stable"

  tasks:
    - name: Read current cmdline.txt
      ansible.builtin.slurp:
        src: /boot/firmware/cmdline.txt
      register: cmdline_raw

    - name: Ensure cgroup parameters are present (append with leading space)
      ansible.builtin.copy:
        dest: /boot/firmware/cmdline.txt
        content: >-
          {{ (cmdline_raw.content | b64decode).rstrip() }}
          {{ ' cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
             if ('cgroup_enable=cpuset' not in (cmdline_raw.content | b64decode))
             else '' }}
          {{ '\n' }}
        owner: root
        group: root
        mode: '0644'
      when: "'cgroup_enable=cpuset' not in (cmdline_raw.content | b64decode)"
      notify: Reboot node

    - name: Add OBS Kubic repo key (gpg dearmored to trusted.gpg.d)
      ansible.builtin.apt_key:
        url: "{{ kubic_key_url }}"
        state: present

    - name: Add OBS Kubic Debian Unstable repository for libcontainers/cri-tools
      ansible.builtin.apt_repository:
        repo: "deb {{ kubic_repo_url }}"
        filename: "{{ kubic_repo_filename }}"
        state: present
        update_cache: yes

    - name: Install cri-tools from OBS repo
      ansible.builtin.apt:
        name: cri-tools
        state: present
        update_cache: yes

    - name: Install vim and dig from standard repo
      ansible.builtin.apt:
        name:
          - vim
          - dnsutils
        state: present
        update_cache: yes

    - name: Ensure net.ipv4.ip_forward=1 is uncommented in /etc/sysctl.conf
      ansible.builtin.replace:
        path: /etc/sysctl.conf
        regexp: '^#?net\.ipv4\.ip_forward\s*=\s*0?'
        replace: 'net.ipv4.ip_forward=1'

    - name: Apply ip_forward setting immediately
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        sysctl_set: no
        state: present
        reload: no

  handlers:
    - name: Reboot node
      ansible.builtin.reboot:
        reboot_timeout: 1800

