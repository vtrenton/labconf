apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-vip-cloud-provider
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vtrenton/labconf
    targetRevision: HEAD
    path: infralab/argo-apps/kube-vip-cloud-provider
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
