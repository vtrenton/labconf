# cilium-install.yml
# k3s-install.yml already stages these before k3s starts. Re-run this to push
# changes (e.g. a version bump in vars/cilium.yml); k3s re-applies changed files.
- name: Stage Cilium manifests on masters
  hosts: masters
  become: true
  gather_facts: false
  vars_files:
    - vars/k3s.yml
    - vars/cilium.yml

  tasks:
    - name: Stage Cilium
      ansible.builtin.include_tasks: tasks/cilium.yml
