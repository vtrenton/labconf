# The Pi firmware injects cgroup_disable=memory; the params below (later on the
# cmdline) re-enable it. k3s refuses to start without the memory cgroup.
# Sets node_prep_reboot_cmdline; reboot.yml does the actual reboot.
- name: Read current cmdline.txt
  ansible.builtin.slurp:
    src: "{{ node_prep_cmdline_file }}"
  register: cmdline_raw

# Token-based so it is idempotent and drops junk like a literal "\n"
- name: Ensure cgroup parameters are in cmdline.txt
  vars:
    # Two characters: backslash, n. Escapes inside Jinja literals don't survive.
    literal_bs_n: "\\n"
    current: "{{ (cmdline_raw.content | b64decode | replace(literal_bs_n, ' ')).split() }}"
    missing: "{{ node_prep_cmdline_params.split() | reject('in', current) | list }}"
  ansible.builtin.copy:
    dest: "{{ node_prep_cmdline_file }}"
    content: "{{ (current + missing) | join(' ') }}\n"
    owner: root
    group: root
    mode: '0755'

# Decide from the running kernel, not from "did this run change the file": a
# failed earlier run would otherwise lose the reboot forever.
- name: Read running kernel cmdline
  ansible.builtin.slurp:
    src: /proc/cmdline
  register: proc_cmdline

- name: Flag reboot if running kernel lacks cgroup params
  ansible.builtin.set_fact:
    node_prep_reboot_cmdline: >-
      {{ node_prep_cmdline_params.split()
         | reject('in', (proc_cmdline.content | b64decode).split())
         | list | length > 0 }}
