apiVersion: k0sctl.k0sproject.io/v1beta1
kind: Cluster
metadata:
  name: k0s-cluster
  user: admin
spec:
  hosts:
  - ssh:
      address: 10.0.0.11
      user: admin
      port: 22
      keyPath: ~/.ssh/id_rsa
    role: controller+worker
    installFlags:
        - "--kubelet-extra-args=--register-with-taints=node-role.kubernetes.io/control-plane=:NoSchedule"
  - ssh:
      address: 10.0.0.12
      user: admin
      port: 22
      keyPath: ~/.ssh/id_rsa
    role: controller+worker
    installFlags:
        - "--kubelet-extra-args=--register-with-taints=node-role.kubernetes.io/control-plane=:NoSchedule"
  - ssh:
      address: 10.0.0.13
      user: admin
      port: 22
      keyPath: ~/.ssh/id_rsa
    role: controller+worker
    installFlags:
        - "--kubelet-extra-args=--register-with-taints=node-role.kubernetes.io/control-plane=:NoSchedule"
  - ssh:
      address: 10.0.0.14
      user: admin
      port: 22
      keyPath: ~/.ssh/id_rsa
    role: worker
  - ssh:
      address: 10.0.0.15
      user: admin
      port: 22
      keyPath: ~/.ssh/id_rsa
    role: worker
  - ssh:
      address: 10.0.0.16
      user: admin
      port: 22
      keyPath: ~/.ssh/id_rsa
    role: worker
  - ssh:
      address: 10.0.0.17
      user: admin
      port: 22
      keyPath: ~/.ssh/id_rsa
    role: worker
  k0s:
    version: v1.33.4+k0s.0
    config:
      apiVersion: k0s.k0sproject.io/v1beta1
      kind: Cluster
      metadata:
        name: k0s
      spec:
      #  api:
      #    address: 10.0.0.10
      #    sans:
      #    - 10.0.0.10
        network:
          kubeProxy:
            disabled: false
            mode: nftables
          provider: custom
          serviceCIDR: 10.43.0.0/16
        extensions:
          helm:
            concurrencyLevel: 5
            repositories:
              - name: cilium
                url: https://helm.cilium.io
            charts:
              - name: cilium
                chartname: cilium/cilium
                namespace: cilium
                order: 1
                values: |
                  tolerations:
                    - key: "node-role.kubernetes.io/control-plane"
                      operator: "Exists"
                      effect: "NoSchedule"
                    - key: "node-role.kubernetes.io/master"
                      operator: "Exists"
                      effect: "NoSchedule"
                    - key: "node.kubernetes.io/not-ready"
                      operator: "Exists"
                      effect: "NoSchedule"
                    - key: "node.kubernetes.io/not-ready"
                      operator: "Exists"
                      effect: "NoExecute"
                  ipam:
                    mode: cluster-pool
                    operator:
                      clusterPoolIPv4PodCIDRList:
                        - 10.42.0.0/16
                      clusterPoolIPv4MaskSize: 24
                  cluster:
                    name: cilium-cluster
                  envoy:
                    enabled: false
                  ingressController:
                    enabled: false
                  gatewayAPI:
                    enabled: false
                  envoyConfig:
                    enabled: false
                  loadBalancer:
                    l7:
                      backend: none
                  hubble:
                    enabled: false
                    relay:
                      enabled: false
                    ui:
                      enabled: false
                  prometheus:
                    enabled: false
                  operator:
                    prometheus:
                      enabled: false
                    replicas: 1 
                  bgpControlPlane:
                    enabled: false
                  externalWorkloads:
                    enabled: false
        storage:
          type: etcd
        telemetry:
          enabled: false
  options:
    wait:
      enabled: true
    drain:
      enabled: true
      gracePeriod: 2m0s
      timeout: 5m0s
      force: true
      ignoreDaemonSets: true
      deleteEmptyDirData: true
      podSelector: ""
      skipWaitForDeleteTimeout: 0s
    concurrency:
      limit: 30
      workerDisruptionPercent: 10
      uploads: 5
    evictTaint:
      enabled: false
      taint: k0sctl.k0sproject.io/evict=true
      effect: NoExecute
      controllerWorkers: false
