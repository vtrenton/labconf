# Synced by infralab's Argo CD (app "pilab") into the pilab cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pilab-system-upgrade-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vtrenton/labconf
    targetRevision: HEAD
    path: pilab/argo-apps/system-upgrade-controller
  destination:
    # Registered by infralab's tbot-argocd (Teleport kube access)
    name: pilab
    namespace: system-upgrade
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # Plans can't be dry-run until the Plan CRD from the same sync exists
      - SkipDryRunOnMissingResource=true
