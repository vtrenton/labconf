// BIND on dns1 (labns): authoritative only, for Unbound.
//
// Clients never talk to BIND. Unbound (binddns/unbound/) answers every
// network on :53 and sends exactly these zones here as stub zones; all other
// names it resolves itself, over DNS-over-TLS. So: no recursion, no
// forwarders, and BIND listens on localhost only.

options {
    directory "/var/cache/bind";

    listen-on port 5300 { 127.0.0.1; };   // not 5353: that is mDNS (avahi)
    listen-on-v6 { none; };

    recursion no;
    allow-query { localhost; };
    allow-transfer { none; };   // a future dns2 gets an explicit entry here

    dnssec-validation no;       // Unbound validates; BIND only serves
};

zone "labnet.lan" IN {
    type master;
    file "/etc/bind/zones/db.labnet.lan";
};

// Real-domain names for LAN services, so they can carry publicly trusted
// (Let's Encrypt) certificates. Only this subdomain: the rest of
// trentonvanderwert.com (e.g. teleport.aws...) still resolves publicly.
zone "lab.trentonvanderwert.com" IN {
    type master;
    file "/etc/bind/zones/db.lab.trentonvanderwert.com";
};

// Wired LAN (home, 192.168.0.0/24).
zone "wired.lan" IN {
    type master;
    file "/etc/bind/zones/db.wired.lan";
};

zone "0.0.10.in-addr.arpa" IN {
    type master;
    file "/etc/bind/zones/10.0.0.rev";
};

// DNS network (VLAN 853): dns1 itself.
zone "53.0.10.in-addr.arpa" IN {
    type master;
    file "/etc/bind/zones/10.0.53.rev";
};
