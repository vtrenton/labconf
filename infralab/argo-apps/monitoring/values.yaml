# kube-prometheus-stack values for infralab. pilab runs the same chart in
# agent mode (pilab/argo-apps/monitoring-agent) and remote-writes here.

# k3s runs etcd, scheduler and controller-manager inside the k3s binary with
# no separately scrapeable endpoints, and there is no kube-proxy (Cilium).
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
  disabled:
    # pilab's agent has no Alertmanager by design, so this fired for it
    # forever. For infralab it's undeliverable anyway (it's about not
    # reaching Alertmanager); Watchdog is the end-to-end check.
    PrometheusNotConnectedToAlertmanagers: true

# Cardinality (k3s): the kubelet's /metrics endpoint also exposes the embedded
# apiserver/etcd/scheduler metrics, so the kubelet and apiserver jobs scraped
# the same large histograms twice (~245k series per cluster, which filled the
# pilab agent's 512Mi in-memory WAL in ~4h). Drop what no bundled rule or
# dashboard uses. Overriding metricRelabelings replaces the chart defaults, so
# those are repeated first.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      # chart default: thin out the duration histograms' buckets
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels: [__name__, le]
      # unused by rules/dashboards (the SLO rules use the _sli_ histogram)
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver_request_duration_seconds|etcd_request_duration_seconds|apiserver_request_body_size_bytes|apiserver_response_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|apiserver_watch_events_sizes)_bucket
kubelet:
  serviceMonitor:
    metricRelabelings:
      # chart default
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      # k3s: control-plane metrics on the kubelet endpoint (the apiserver job
      # already has what the apiserver dashboards and rules use)
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd|scheduler|workqueue|aggregator|apiextensions|authentication|authorization|field_validation)_.+

# Alertmanager -> AWS SNS, keyless (same chain as cert-manager's Route 53
# access): a tbot sidecar keeps 1h credentials for role labconf-alertmanager
# in a RAM-only volume; Alertmanager re-reads them for every notification.
# AWS side: infralab/aws/alerting.yaml. Teleport side:
# teleport/resources/alertmanager-identity.yaml. Lab-specific rules:
# manifests/rules-lab.yaml. UI (alerts, silences): Teleport app
# "alertmanager-infralab".
alertmanager:
  enabled: true
  service:
    labels:
      teleport.dev/app: "true"
    annotations:
      teleport.dev/name: alertmanager-infralab
      teleport.dev/port: http-web

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: email
      group_by: [cluster, namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        # Dead man's switch: Watchdog always fires; re-sent every ~1-2 min to
        # labconf-heartbeat. A CloudWatch alarm emails if it stops.
        - matchers: ['alertname = "Watchdog"']
          receiver: heartbeat
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 1m
        - matchers: ['alertname = "InfoInhibitor"']
          receiver: "null"
        # info alerts stay in the UI only
        - matchers: ['severity = "info"']
          receiver: "null"
    # The chart's defaults, per cluster
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [cluster, namespace, alertname]
      - source_matchers: ['severity = "warning"']
        target_matchers: ['severity = "info"']
        equal: [cluster, namespace, alertname]
      - source_matchers: ['alertname = "InfoInhibitor"']
        target_matchers: ['severity = "info"']
        equal: [cluster, namespace]
      - target_matchers: ['alertname = "InfoInhibitor"']
    receivers:
      - name: "null"
      - name: email
        sns_configs:
          - topic_arn: arn:aws:sns:us-east-1:321051512565:labconf-alerts
            sigv4:
              region: us-east-1
            # SNS email subjects: ASCII, under 100 characters
            subject: >-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}]
              {{ .CommonLabels.cluster }} {{ .CommonLabels.alertname }}
            message: |-
              {{ range .Alerts }}{{ .Status | toUpper }} {{ .Labels.alertname }} ({{ .Labels.cluster }}{{ with .Labels.namespace }}/{{ . }}{{ end }}{{ with .Labels.pod }}/{{ . }}{{ end }})
              {{ with .Annotations.summary }}{{ . }}
              {{ end }}{{ with .Annotations.description }}{{ . }}
              {{ end }}{{ with .Annotations.runbook_url }}Runbook: {{ . }}
              {{ end }}Since: {{ .StartsAt.Format "2006-01-02 15:04 MST" }}

              {{ end }}
      - name: heartbeat
        sns_configs:
          - topic_arn: arn:aws:sns:us-east-1:321051512565:labconf-heartbeat
            sigv4:
              region: us-east-1
            subject: labconf heartbeat
            message: Watchdog

  alertmanagerSpec:
    # Patches the operator's alertmanager container (by name) and adds tbot.
    # Both run as the pod's user, so Alertmanager can read the 0600 file
    # tbot writes.
    containers:
      - name: alertmanager
        env:
          - name: AWS_SHARED_CREDENTIALS_FILE
            value: /var/run/aws/aws_credentials
      # --- tbot sidecar: SNS credentials that never leave this pod ---
      # Joins Teleport as bot labconf-alertmanager with this pod's own service
      # account token, gets the SVID
      # spiffe://teleport.trentonvanderwert.com/infralab/alertmanager,
      # exchanges it with IAM Roles Anywhere for 1h credentials. No Secret,
      # nothing in etcd. If Teleport is down when the pod restarts, nothing
      # can be sent; the heartbeat alarm in AWS catches that.
      - name: tbot
        # Keep in step with the Teleport cluster version (and cert-manager's)
        image: public.ecr.aws/gravitational/tbot-distroless:18.11.8
        args: [start, -c, /config/tbot.yaml, --log-format, json, --diag-addr, "0.0.0.0:3001"]
        env:
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: KUBERNETES_TOKEN_PATH
            value: /var/run/secrets/tokens/join-sa-token
        volumeMounts:
          - name: tbot-config
            mountPath: /config
            readOnly: true
          - name: join-sa-token
            mountPath: /var/run/secrets/tokens
            readOnly: true
          - name: aws-credentials
            mountPath: /var/run/aws
        ports:
          - name: tbot-diag
            containerPort: 3001
            # The API default, spelled out: the Alertmanager CRD adds it, and
            # Argo CD only ignores defaults on built-in types (Deployments)
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /livez
            port: tbot-diag
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          readOnlyRootFilesystem: true
    volumes:
      # Shared with tbot; RAM only, gone with the pod
      - name: aws-credentials
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: tbot-config
        configMap:
          name: tbot-alertmanager
      # This pod's service account token, for tbot's Teleport join. Teleport
      # requires its cluster name as the audience.
      - name: join-sa-token
        projected:
          sources:
            - serviceAccountToken:
                path: join-sa-token
                audience: teleport.trentonvanderwert.com
                expirationSeconds: 600
    # Mounted into the alertmanager container
    volumeMounts:
      - name: aws-credentials
        mountPath: /var/run/aws
        readOnly: true

prometheus-node-exporter:
  prometheus:
    monitor:
      # Node name on every node-exporter series (dashboards group by it)
      # action is spelled out (it's the API default) so Argo CD's diff
      # matches the live object
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node

prometheus:
  # Teleport app "prometheus-infralab" (UI + query API, behind Teleport login)
  service:
    labels:
      teleport.dev/app: "true"
    annotations:
      teleport.dev/name: prometheus-infralab
      teleport.dev/port: http-web
  prometheusSpec:
    # Every scraped series gets cluster=infralab; pilab's arrive with
    # cluster=pilab. Dashboards use the label to tell them apart.
    scrapeClasses:
      - name: cluster-label
        default: true
        relabelings:
          - action: replace
            targetLabel: cluster
            replacement: infralab

    # pilab's agent pushes to /api/v1/write (exposed on the Gateway, see
    # manifests/httproutes.yaml). Unauthenticated: LAN only.
    enableRemoteWriteReceiver: true

    # Pick up ServiceMonitors/PodMonitors/rules from any app, not just this
    # release
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false

    retention: 30d
    retentionSize: 40GB
    # local-path: on one node's NVMe; the pod is pinned to that node
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

grafana:
  # Teleport app "grafana" (JWT login, below). The TV keeps the anonymous
  # Gateway path (manifests/httproutes.yaml).
  service:
    labels:
      teleport.dev/app: "true"
    annotations:
      teleport.dev/name: grafana
      teleport.dev/port: http-web
      # Grafana builds some absolute URLs from root_url (the LAN name); send
      # those back to the Teleport app address
      teleport.dev/app-rewrite: |
        redirect:
          - grafana.infra.lab.trentonvanderwert.com

  # Stateless: dashboards come from ConfigMaps (sidecar), datasource from the
  # chart. Nothing is edited in the UI.
  persistence:
    enabled: false

  # No admin user at all, so no password to generate, store or drift on every
  # Argo CD render. Anonymous Viewer only.
  env:
    GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"

  grafana.ini:
    server:
      root_url: https://grafana.infra.lab.trentonvanderwert.com/
    auth:
      disable_login_form: true
    # Through Teleport: every request carries a JWT signed by the cluster
    # (header Teleport-Jwt-Assertion), verified against its JWKS. Users are
    # created on the fly; lab-admin -> Admin, everyone else Viewer.
    # Without the header (the TV on the LAN): anonymous Viewer, below.
    auth.jwt:
      enabled: true
      header_name: Teleport-Jwt-Assertion
      jwk_set_url: https://teleport.aws.trentonvanderwert.com/.well-known/jwks.json
      expect_claims: '{"iss": "teleport.trentonvanderwert.com"}'
      username_claim: sub
      email_claim: sub
      auto_sign_up: true
      role_attribute_path: "contains(roles[*], 'lab-admin') && 'Admin' || 'Viewer'"
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    dashboards:
      # The TV: https://grafana.infra.lab.trentonvanderwert.com/?kiosk
      default_home_dashboard_path: /tmp/dashboards/lab-overview.json
    users:
      default_theme: dark
    analytics:
      reporting_enabled: false
      check_for_updates: false

  # Namespaced RBAC with our own ConfigMap-only Role
  # (manifests/grafana-rbac.yaml) instead of the chart's cluster-wide
  # ConfigMap+Secret read.
  rbac:
    namespaced: true
    useExistingRole: grafana-sidecar

  # Dashboards and the datasource are ConfigMaps in this namespace; don't
  # watch Secrets or other namespaces (the chart defaults: both, ALL).
  sidecar:
    datasources:
      resource: configmap
      searchNamespace: [monitoring]
    dashboards:
      resource: configmap
      searchNamespace: [monitoring]
      # Adds a cluster picker to the bundled dashboards
      multicluster:
        global:
          enabled: true
