# Fields the API server would default (group, kind, weight, the "/" match)
# are spelled out so Argo CD's diff matches the live objects.
#
# Grafana for the TV and browsers on the LAN.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra
      namespace: gateway
  hostnames:
    - grafana.infra.labnet.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-grafana
          port: 80
          weight: 1
---
# Remote-write endpoint for pilab's Prometheus agent. Only the write path is
# routed; the Prometheus UI and query API stay in-cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-remote-write
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra
      namespace: gateway
  hostnames:
    - prometheus.infra.labnet.lan
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/v1/write
          method: POST
      backendRefs:
        - group: ""
          kind: Service
          name: kube-prometheus-stack-prometheus
          port: 9090
          weight: 1
