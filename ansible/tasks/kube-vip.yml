# Stages kube-vip in the k3s auto-deploy dir before k3s starts, so the API
# VIP comes up with the first server.
- name: Ensure k3s manifests directory exists
  ansible.builtin.file:
    path: "{{ k3s_data_dir }}/server/manifests"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy kube-vip manifests
  ansible.builtin.copy:
    src: "kv-api-lb/{{ item }}"
    dest: "{{ k3s_data_dir }}/server/manifests/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - kube-vip-rbac.yaml
    - kube-vip-ds.yaml
