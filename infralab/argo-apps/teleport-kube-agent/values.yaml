# teleport-kube-agent chart values for infralab.
roles: kube
enterprise: true
proxyAddr: teleport.aws.trentonvanderwert.com:443
teleportClusterName: teleport.trentonvanderwert.com
kubeClusterName: infralab
labels:
  lab: infralab

# No secret: the chart mounts a projected service-account token and joins
# with the Kubernetes JWKS method. Service account = release name
# (teleport-agent:teleport-kube-agent), which the token allows.
joinParams:
  method: kubernetes
  tokenName: infralab-kube-agent

# Versions move through git (chart bump), so Argo CD and an in-cluster
# updater never fight over the image.
updater:
  enabled: false
