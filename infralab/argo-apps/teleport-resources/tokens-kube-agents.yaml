# Kubernetes agent join tokens: Kubernetes JWKS join. Each pins its cluster's
# service-account signing keys (public). Rebuilding a cluster changes them:
#   KUBECONFIG=~/.kube/<lab>-k3s.yaml kubectl get --raw /openid/v1/jwks
# and replace the jwks below in the same commit.
---
apiVersion: resources.teleport.dev/v2
kind: TeleportProvisionToken
metadata:
  name: infralab-kube-agent
spec:
  roles: [Kube]
  join_method: kubernetes
  kubernetes:
    type: static_jwks
    static_jwks:
      jwks: '{"keys":[{"use":"sig","kty":"RSA","kid":"h4q7B0myXc5FwDWeH4RnbMmSnXBu3qiugFjskf5HO2M","alg":"RS256","n":"uW2Qg1ZsYER9n1-DoLvAb_e-OAV4WPTRD2qha3KWoeeNZXCU5phzeJSPjrX8dZe5RG0k2oWdYnH2pzGf_1gr_SGoNwepkve8Al6wkLXSov_xyNBxODIbMLugcKYuvfaV3DNgif_VgJc6eKETOP3go0UVY0Zy6IRvzOA8R75Wm4UqOMttAagzwHpUR64yzcZGXgNlN2QVmkr8COyBsPienpJOIO8b8C2587JiCyIbj4ZG5Se93VAK1iTWKHJaC7_7DBNxhDUn-H-tpS9RAd6FenUGs3PZ_Tx6Abo1YfQ4oLLofx-b5xNVJSgTMWipLleTDK0l2DMWTV2pfk4LIRM97Q","e":"AQAB"}]}'
    allow:
      # namespace:serviceaccount of infralab/argo-apps teleport-kube-agent
      - service_account: "teleport-agent:teleport-kube-agent"
