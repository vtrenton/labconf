# IoT DNS allowlist (included in the "iot" view of unbound.conf).
#
# Everything not listed here is REFUSED for 10.0.2.0/24 and logged
# (log-local-actions). One line per name: `transparent` resolves it and every
# name below it normally. Use the narrowest name that works
# (iot.vendor.example, not vendor.example), and say who needs it and why:
#
#   # thermostat (10.0.2.23): app control, 2026-11
#   local-zone: "api.vendor.example." transparent
#
# CNAMEs: if an allowed name answers via a CNAME (e.g. to a CDN), the target
# is checked too and needs its own line. Workflow: udm-pro-config
# OPERATIONS.md, "Adding an IoT device".
#
# Apply after a change: binddns/ansible, playbooks/site.yml (restarts Unbound
# on dns2, then dns1).

# --- Local time, not the internet -----------------------------------------
# These names never resolve to the real servers: `redirect` answers the name
# and everything below it (0.pool.ntp.org, ...) with the UDM's iot address,
# and the device gets NTP from the UDM itself (udm-pro-config
# lan_firewall.gateway_allow, per device). Without an answer the P1S retried
# about 95 times a second per DNS server.

# P1S (10.0.2.10): its four NTP names, 2026-11
local-zone: "pool.ntp.org." redirect
local-data: "pool.ntp.org. A 10.0.2.1"
local-zone: "time.google.com." redirect
local-data: "time.google.com. A 10.0.2.1"
local-zone: "time.windows.com." redirect
local-data: "time.windows.com. A 10.0.2.1"
local-zone: "time.cloudflare.com." redirect
local-data: "time.cloudflare.com. A 10.0.2.1"
