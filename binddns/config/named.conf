// trusted clients
acl trusted {
    127.0.0.1;
    ::1;
    10.0.0.0/24;
    192.168.0.0/24;
    10.88.0.0/16;     // podman bridge (host + port-forwarded clients)
};

options {
    directory "/var/cache/bind";

    // IPs BIND will listen on
    listen-on { any; };

    recursion yes;
    allow-query       { trusted; };
    allow-recursion   { trusted; };
    allow-query-cache { trusted; };

    // Upstream DNS servers for non-local queries
    forwarders {
        9.9.9.9;
        149.112.112.112;
    };

    // Enable the DNS server to act as a caching server
    forward only;

    dnssec-validation auto;

};

zone "labnet.lan" IN {
    type master;
    file "/etc/bind/zones/db.labnet.lan"; // Path to the forward zone file
};

// Real-domain names for LAN services, so they can carry publicly trusted
// (Let's Encrypt) certificates. Only this subdomain: the rest of
// trentonvanderwert.com (e.g. teleport.aws...) still resolves publicly.
zone "lab.trentonvanderwert.com" IN {
    type master;
    file "/etc/bind/zones/db.lab.trentonvanderwert.com";
};

zone "0.0.10.in-addr.arpa" IN {
    type master;
    file "/etc/bind/zones/10.0.0.rev"; // Path to the reverse zone file
};

