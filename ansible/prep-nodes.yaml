# prep-nodes.yml
- name: Prepare nodes and install cri-tools
  hosts: all
  become: true
  gather_facts: true

  vars:
    # cri-tools comes from the official Kubernetes package repo (pkgs.k8s.io).
    # Pin the minor version to match your cluster.
    k8s_minor_version: "v1.34"
    k8s_repo_url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_minor_version }}/deb/"

    k3s_mount_device: "/dev/sda"
    k3s_mount_point: "/var/lib/k3s"
    k3s_fstype: "ext4"

  tasks:
    # ----- Boot cmdline flags (cgroups) -----
    - name: Read current cmdline.txt
      ansible.builtin.slurp:
        src: /boot/firmware/cmdline.txt
      register: cmdline_raw

    - name: Ensure cgroup parameters are present (append with leading space)
      ansible.builtin.copy:
        dest: /boot/firmware/cmdline.txt
        content: >-
          {{ (cmdline_raw.content | b64decode).rstrip() }}
          {{ ' cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1'
             if ('cgroup_enable=cpuset' not in (cmdline_raw.content | b64decode))
             else '' }}
          {{ '\n' }}
        owner: root
        group: root
        mode: '0644'
      when: "'cgroup_enable=cpuset' not in (cmdline_raw.content | b64decode)"
      notify: Reboot node

    # ----- Kubernetes repo + cri-tools -----
    # Debian 13 has no apt-key, so the key is referenced via Signed-By in a deb822 source.
    - name: Install python3-debian (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: yes

    - name: Add Kubernetes apt repository for cri-tools
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: "{{ k8s_repo_url }}"
        suites: /
        signed_by: "{{ k8s_repo_url }}Release.key"
        state: present

    - name: Install cri-tools from Kubernetes repo
      ansible.builtin.apt:
        name: cri-tools
        state: present
        update_cache: yes

    # ----- Utilities from standard repo -----
    - name: Install vim and dig from standard repo
      ansible.builtin.apt:
        name:
          - vim
          - dnsutils
        state: present
        update_cache: yes

    # ----- Kernel networking for Kubernetes (persist + immediate) -----
    # bridge-nf-call-* sysctls only exist once br_netfilter is loaded
    - name: Load br_netfilter now and on boot
      community.general.modprobe:
        name: br_netfilter
        state: present
        persistent: present

    # Debian 13 has no /etc/sysctl.conf; settings live in /etc/sysctl.d/*.conf
    - name: Set Kubernetes sysctls in /etc/sysctl.d/99-kubeconfig.conf
      ansible.posix.sysctl:
        name: "{{ item }}"
        value: '1'
        sysctl_file: /etc/sysctl.d/99-kubeconfig.conf
        sysctl_set: yes
        state: present
        reload: yes
      loop:
        - net.ipv4.ip_forward
        - net.bridge.bridge-nf-call-iptables
        - net.bridge.bridge-nf-call-ip6tables

    # ----- Prepare and mount /dev/sda -> /var/lib/k3s -----
    - name: Check that {{ k3s_mount_device }} exists
      ansible.builtin.stat:
        path: "{{ k3s_mount_device }}"
      register: sda_stat

    - name: Detect existing filesystem type on {{ k3s_mount_device }}
      ansible.builtin.command: "blkid -o value -s TYPE {{ k3s_mount_device }}"
      register: sda_fs
      changed_when: false
      failed_when: false
      when: sda_stat.stat.exists

    - name: Create ext4 filesystem on {{ k3s_mount_device }} if not present
      ansible.builtin.filesystem:
        fstype: "{{ k3s_fstype }}"
        dev: "{{ k3s_mount_device }}"
      when:
        - sda_stat.stat.exists
        - sda_fs.rc != 0 or (sda_fs.stdout | trim) == ""

    - name: Ensure mount point {{ k3s_mount_point }} exists
      ansible.builtin.file:
        path: "{{ k3s_mount_point }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Mount {{ k3s_mount_device }} at {{ k3s_mount_point }} and persist in fstab
      ansible.builtin.mount:
        path: "{{ k3s_mount_point }}"
        src: "{{ k3s_mount_device }}"
        fstype: "{{ k3s_fstype }}"
        opts: "defaults"
        state: mounted
      when: sda_stat.stat.exists

  handlers:
    - name: Reboot node
      ansible.builtin.reboot:
        reboot_timeout: 1800

