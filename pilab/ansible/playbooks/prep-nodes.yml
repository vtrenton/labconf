# prep-nodes.yml
# OS-level prep: boot cmdline, Debian arm64 kernel, packages, kernel
# modules/sysctls, SSD mount. Must run before cluster.yml (k3s_data_dir lives
# on the SSD).
#
# serial: 1 so any reboots roll through the cluster one node at a time, and a
# node that fails verification stops the rollout.
- name: Prepare nodes
  hosts: picluster
  become: true
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - node_prep
