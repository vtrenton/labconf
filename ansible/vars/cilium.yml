cilium_version: "1.20.4"
# Must match what the Cilium release supports (Documentation/conf.py upstream)
gateway_api_version: "v1.6.3"

cilium_interface: eth0

# LoadBalancer IPs for services, announced by a worker node.
# The API server VIP is handled by kube-vip, not Cilium.
cilium_lb_pool_start: 10.0.0.20
cilium_lb_pool_stop: 10.0.0.25

# Fixed IPs from that pool for the shared Gateway and shared Ingress
cilium_gateway_ip: 10.0.0.20
cilium_ingress_ip: 10.0.0.21
